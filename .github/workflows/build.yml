# Tests and the suite MSI on every push to main and every pull request; a tag v<version> also publishes a GitHub
# Release with the MSI (the installed app finds it there and offers the update). The tag must match <Version> in
# capture/src/Recordingz.Capture/Recordingz.Capture.csproj (tests/test_version.py keeps the other parts equal).
#
# The MSI is the whole suite (installer/stage-suite.ps1): the recording app, the review window, uv and the Python
# project. The GPU extras (whisperx, torch, easyocr) are too big for CI; their tests skip.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # creating the release on a tag

jobs:
  transcribe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: transcribe
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: transcribe/tests/web/package-lock.json

      - name: Install
        run: |
          uv sync --frozen
          npm ci --prefix tests/web

      - name: Test
        run: uv run --frozen pytest -q

  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: review/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: review/src-tauri

      - name: Test the capture app
        working-directory: capture
        run: dotnet test -c Release --logger "console;verbosity=normal"

      - name: Test and build the review window
        working-directory: review
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed" }
          npm ci
          npm run build

      - name: Build MSI
        id: msi
        run: |
          $version = (dotnet msbuild capture/src/Recordingz.Capture/Recordingz.Capture.csproj -getProperty:Version).Trim()
          $suite = ./installer/stage-suite.ps1 -Version $version `
              -ReviewExe review/src-tauri/target/release/recordingz-review.exe | Select-Object -Last 1
          $msi = ./installer/build-msi.ps1 -Suite $suite | Select-Object -Last 1
          "path=$msi" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: recordingz-${{ steps.msi.outputs.version }}-msi
          path: ${{ steps.msi.outputs.path }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [transcribe, build]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: recordingz-*-msi
          path: msi

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = Get-ChildItem msi -Recurse -Filter "recordingz-*-x64.msi" | Select-Object -First 1
          $version = $msi.Name -replace '^recordingz-(.+)-x64\.msi$', '$1'
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") { throw "tag $tag does not match the project version $version" }
          # the notes of this version from CHANGELOG.md
          $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($version)) – [0-9-]+\r?\n(.*?)(?=^## |\z)")
          if (-not $m.Success) { throw "no CHANGELOG.md entry for $version" }
          $notes = $m.Groups[1].Value.Trim() + "`n`nThe review window prepares the Python environment on its first start after the install or update."
          gh release create $tag $msi.FullName --title "recordingz $tag" --notes $notes
